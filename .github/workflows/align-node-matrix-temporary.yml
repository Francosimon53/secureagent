name: Align Node matrix (temporary)

on:
  push:
    branches:
      - docs/recruiter-positioning

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/recruiter-positioning
          fetch-depth: 0

      - name: Align supported Node versions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          old = 'node-version: [18, 20, 22]'
          new = 'node-version: [20, 22]'
          if old not in text:
              raise SystemExit('Expected Node matrix not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit CI alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git commit -m "ci: test only supported Node versions"
          git push origin HEAD:docs/recruiter-positioning
